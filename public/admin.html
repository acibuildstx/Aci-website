<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACI Gallery &amp; Category Manager | Owner Admin</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .admin-bar { background: var(--text-navy); color: #fff; padding: 1rem 0; border-bottom: 2px solid var(--accent-gold); }
    .admin-bar-inner { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; }
    .admin-layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; padding: 2rem 0; }
    .admin-panel { background: #fff; border: var(--border-thin); padding: 1.25rem; }
    .cat-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.65rem; border: var(--border-thin); margin-bottom: 0.5rem; background: var(--bg-primary); cursor: pointer; }
    .cat-row.active { border-color: var(--accent-gold); background: #fff; font-weight: 700; }
    .photo-admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-top: 1.25rem; }
    .photo-admin-card { border: var(--border-thin); background: var(--bg-primary); padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .photo-admin-card img { aspect-ratio: 4/3; object-fit: cover; width: 100%; }
    .admin-btn-row { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .mini-btn { padding: 0.35rem 0.6rem; font-size: 0.75rem; border: var(--border-thin); background: #fff; cursor: pointer; font-weight: 600; }
    .mini-btn.gold { border-color: var(--accent-gold); color: var(--text-navy); }
    .mini-btn.danger { color: #B42318; border-color: #FDA29B; }
    .status-pill { font-size: 0.78rem; padding: 0.3rem 0.65rem; background: rgba(255,255,255,0.12); border: 1px solid var(--accent-gold); }
    .photo-change-dialog { width: min(34rem, calc(100% - 2rem)); }
    .photo-change-dialog::backdrop { background: rgb(0 0 0 / 55%); }
    .photo-change-preview { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0; }
    .photo-change-preview figure { flex: 1 1 8rem; margin: 0; }
    .photo-change-preview img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; }
    .photo-change-preview figcaption { font-weight: 600; }
    @media (max-width: 820px) { .admin-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="admin-bar">
    <div class="container admin-bar-inner">
      <div>
        <strong>ACI OWNER PORTAL</strong>
        <span class="status-pill" id="adminStatus" role="status">Connecting…</span>
      </div>
      <div style="display:flex;gap:0.65rem;flex-wrap:wrap;">
        <a href="/" target="_blank" rel="noopener" class="btn btn-outline-gold btn-sm">PREVIEW SITE ↗</a>
        <button type="button" id="saveDraftBtn" class="btn btn-outline-gold btn-sm">SAVE DRAFT</button>
        <button type="button" id="publishLiveBtn" class="btn btn-navy btn-sm" style="border-color:var(--accent-gold);">PUBLISH LIVE</button>
      </div>
    </div>
  </header>

  <main class="container admin-layout">
    <aside class="admin-panel">
      <h2 style="font-family:var(--font-serif);margin-top:0;">Gallery Categories</h2>
      <p style="font-size:0.84rem;color:var(--text-muted);">Tap a category to manage its photos, rename it, toggle visibility, or change tab order.</p>
      <div id="adminCategoryList"></div>
      <button type="button" id="addCategoryBtn" class="btn btn-outline-gold btn-sm btn-block" style="margin-top:0.75rem;">+ ADD CATEGORY</button>
    </aside>

    <section class="admin-panel">
      <div class="form-row">
        <div class="form-group">
          <label for="editCatName">Category Display Name</label>
          <input type="text" id="editCatName" class="form-control" />
        </div>
        <div class="form-group">
          <label for="editCatVisible">Website Visibility</label>
          <select id="editCatVisible" class="form-control">
            <option value="true">Visible on Website</option>
            <option value="false">Hidden (Draft Only)</option>
          </select>
        </div>
      </div>

      <div class="file-drop-zone" style="margin-top:0.5rem;">
        <input type="file" id="adminUploadInput" accept="image/*" multiple />
        <p class="drop-title">+ Upload Photographs to This Category</p>
        <p class="drop-hint">Automatically creates optimized WebP for the website &amp; saves original high-res backup to private R2 vault</p>
      </div>

      <div class="photo-admin-grid" id="adminPhotoGrid"></div>
    </section>
  </main>

  <dialog class="photo-change-dialog" id="photoChangeDialog" aria-labelledby="photoChangeTitle">
    <h2 id="photoChangeTitle"></h2>
    <p id="photoChangeDescription"></p>
    <div class="photo-change-preview">
      <figure id="currentPhotoPreview"><img alt="" /><figcaption id="currentPhotoLabel">Current</figcaption></figure>
      <figure id="replacementPhotoPreview"><img alt="" /><figcaption>New</figcaption></figure>
    </div>
    <form method="dialog">
      <div id="photoDestinationField" class="form-group" hidden>
        <label for="photoDestination">Move to category</label>
        <select id="photoDestination" class="form-control"></select>
      </div>
      <div class="admin-btn-row">
        <button class="mini-btn" value="cancel" autofocus>Cancel</button>
        <button class="mini-btn gold" id="confirmPhotoChange" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <script src="/js/ui-utils.js"></script>
  <script src="/js/site-config.js?v=owner-photos-v2"></script>
  <script src="/js/admin.js?v=photo-edits-v1"></script>
</body>
</html>
