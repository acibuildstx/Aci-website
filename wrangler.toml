name = "aci-website"
compatibility_date = "2026-01-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "ACI_DB"
database_name = "aci-website"
database_id = "f8e3433c-391a-4eb7-9a1f-de6d7447883c"
[[r2_buckets]]
binding = "ACI_PUBLIC_BUCKET"
bucket_name = "aci-portfolio-public"

[[r2_buckets]]
binding = "ACI_PRIVATE_BUCKET"
bucket_name = "aci-client-uploads"

[vars]
# Optional simple owner login: add OWNER_PASSWORD as an encrypted Pages secret
# (16+ characters). Username: owner. Leave the three Access values below empty.
# Never put the password in this file. Existing Access configurations take priority.
ADMIN_NOTIFY_EMAIL = "acibuildstx@gmail.com"
FROM_EMAIL = "notifications@acibuildstx.com" # Sender on the verified Resend domain.
ACCESS_ISSUER = "" # https://YOUR-TEAM.cloudflareaccess.com
ACCESS_AUD = "" # Application Audience (AUD) tag; comma-separated if using several apps.
OWNER_EMAILS = "" # Comma-separated authorized owner email addresses.
