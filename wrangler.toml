name = "aci-website-v2"
compatibility_date = "2026-01-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "ACI_DB"
database_name = "aci-v2-db"
database_id = "00000000-0000-4000-8000-000000000000" # Replace with the independently provisioned V2 D1 ID before cloud use.
[[r2_buckets]]
binding = "ACI_PUBLIC_BUCKET"
bucket_name = "aci-v2-portfolio"

[[r2_buckets]]
binding = "ACI_PRIVATE_BUCKET"
bucket_name = "aci-v2-client-uploads"

[vars]
ADMIN_NOTIFY_EMAIL = "acibuildstx@gmail.com"
FROM_EMAIL = "" # Required: a sender on your verified Resend domain.
ACCESS_ISSUER = "" # https://YOUR-TEAM.cloudflareaccess.com
ACCESS_AUD = "" # Application Audience (AUD) tag; comma-separated if using several apps.
OWNER_EMAILS = "" # Comma-separated authorized owner email addresses.
